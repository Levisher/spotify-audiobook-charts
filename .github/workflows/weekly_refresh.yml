name: Weekly audiobook refresh

on:
  # Every Monday 13:00 UTC = 09:00 ET (during ET daylight saving)
  schedule:
    - cron: "0 13 * * 1"
  # Manual trigger from the Actions tab — for ad-hoc refresh
  workflow_dispatch:
  # Touch + push .trigger to fire an ad-hoc refresh without needing PAT/API
  push:
    paths:
      - '.trigger'

permissions:
  contents: write   # so the workflow can commit & push back into the repo

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write credentials from secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p .creds
          printf '%s' "$GEMINI_API_KEY" > .creds/gemini_api_key.txt
          chmod 600 .creds/gemini_api_key.txt

      - name: Make sure output dir for PDFs exists
        run: mkdir -p output/pdfs

      - name: Run weekly refresh
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          OUTPUT_DIR: ${{ github.workspace }}/output/pdfs
        run: python refresh_all.py

      - name: Commit & push the updated workbook + PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audiobooks.xlsx output/pdfs/*.pdf || true
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
          else
            git commit -m "Weekly refresh: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload PDFs as a workflow artifact (also downloadable from Actions tab)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-pdfs-${{ github.run_number }}
          path: output/pdfs/*.pdf
          if-no-files-found: warn
          retention-days: 90
